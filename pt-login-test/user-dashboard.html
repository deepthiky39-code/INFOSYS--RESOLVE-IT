<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Dashboard – Public Transport Grievance System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- your main css if any -->
  <link rel="stylesheet" href="style.css" />

  <style>
    * , *::before, *::after { box-sizing: border-box; }
    :root {
      --bg-beige: #f6ebdd;
      --card-bg: #ffffff;
      --border-soft: #e4ded3;
      --text-main: #1f2933;
      --text-muted: #6b7280;
      --primary: #e53935;
      --radius-lg: 20px;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.12);
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }
    body {
      margin: 0;
      background: var(--bg-beige);
      font-family: var(--font-main);
      color: var(--text-main);
    }
    .page {
      min-height: 100vh;
      padding: 24px 40px 32px;
      display: flex;
      flex-direction: column;
    }

    /* top header */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-circle {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 18px;
      box-shadow: 0 10px 25px rgba(229, 57, 53, 0.45);
    }
    .topbar-title-block h1 {
      margin: 0;
      font-size: 20px;
    }
    .topbar-title-block p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
    .topbar-email {
      color: var(--text-muted);
    }
    .btn-outline {
      border-radius: 999px;
      padding: 7px 16px;
      border: 1px solid #e11d48;
      background: #fff;
      color: #e11d48;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    /* main card */
    .dashboard-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 26px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-soft);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* header + horizontal tabs */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }
    .card-header h2 {
      margin: 0;
      font-size: 18px;
    }
    .card-header p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .tab-row {
      display: inline-flex;
      background: #f3f4f6;
      border-radius: 999px;
      padding: 3px;
      gap: 4px;
    }
    .tab-btn {
      border-radius: 999px;
      border: none;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      background: transparent;
      color: #6b7280;
    }
    .tab-btn.active {
      background: #ffffff;
      color: #111827;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
    }

    /* content area below tabs */
    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }

    /* form styles */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 16px;
      margin-top: 10px;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
    }
    .form-field label {
      color: var(--text-muted);
    }
    .form-field input,
    .form-field select,
    .form-field textarea {
      border-radius: 10px;
      border: 1px solid #d4d4d8;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      background: #ffffff;
    }
    .form-field textarea {
      resize: vertical;
    }
    .full-row {
      grid-column: 1 / -1;
    }
    .btn-primary {
      border-radius: 999px;
      border: none;
      padding: 9px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 10px 25px rgba(229, 57, 53, 0.4);
    }
    .success-msg {
      margin-top: 8px;
      font-size: 13px;
      color: #15803d;
    }

    /* my complaints cards */
    .complaints-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .complaint-card {
      background: #fbfbfb;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 1.5fr);
      gap: 10px;
      font-size: 13px;
    }
    .complaint-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .complaint-desc {
      color: #4b5563;
      margin-bottom: 6px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: #6b7280;
      font-size: 12px;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
    }
    .status-open    { background: #fff7ed; color: #c05621; }
    .status-in-progress { background: #eff6ff; color: #1d4ed8; }
    .status-resolved    { background: #dcfce7; color: #15803d; }

    .complaint-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
    }
    .feedback-text {
      font-size: 12px;
      color: #4b5563;
      text-align: right;
    }
    .btn-secondary {
      border-radius: 999px;
      border: none;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: #111827;
      color: #fff;
    }
    .empty-text {
      font-size: 13px;
      color: #6b7280;
    }

    @media (max-width: 960px) {
      .page { padding: 18px 16px 24px; }
      .complaint-card { grid-template-columns: 1fr; }
      .complaint-actions { align-items: flex-start; }
      .card-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="logo-circle">PT</div>
        <div class="topbar-title-block">
          <h1>Public Transport Grievance System</h1>
          <p>User Dashboard</p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="topbar-email" id="currentUserEmail"></span>
        <button class="btn-outline" id="logoutBtnUser">Logout</button>
      </div>
    </header>

    <!-- main card -->
    <section class="dashboard-card">
      <!-- top row: heading + horizontal tabs -->
      <div class="card-header">
        <div>
          <h2>Submit & Track Complaints</h2>
          <p>Switch between submitting a new grievance and viewing your complaints.</p>
        </div>
        <nav class="tab-row">
          <button class="tab-btn active" data-tab="submitTab">Submit Complaint</button>
          <button class="tab-btn" data-tab="myTab">My Complaints</button>
        </nav>
      </div>

      <!-- content box down -->
      <div class="tab-panel active" id="submitTab">
        <form id="complaintForm">
          <div class="form-grid">
            <div class="form-field">
              <label>Transport Type</label>
              <select id="transportType" required>
                <option value="">Select type</option>
                <option>Bus</option>
                <option>Train</option>
                <option>Metro</option>
              </select>
            </div>
            <div class="form-field">
              <label>Complaint Title</label>
              <input
                type="text"
                id="complaintTitle"
                placeholder="Brief summary of the issue"
                required
              />
            </div>

            <div class="form-field">
              <label>Route / Location</label>
              <input
                type="text"
                id="route"
                placeholder="e.g., Route 45, Line 2, Platform 3"
                required
              />
            </div>

            <div class="form-field">
              <label>Category (optional)</label>
              <input
                type="text"
                id="category"
                placeholder="e.g., Safety, Delay, Cleanliness"
              />
            </div>

            <div class="form-field">
              <label>Date of Incident</label>
              <input type="date" id="incidentDate" />
            </div>

            <div class="form-field full-row">
              <label>Description</label>
              <textarea
                id="description"
                rows="4"
                placeholder="Provide detailed information about the issue"
                required
              ></textarea>
            </div>

            <div class="form-field full-row">
              <button type="submit" class="btn-primary">
                Submit Complaint
              </button>
              <span class="success-msg" id="complaintSuccess" hidden>
                Complaint submitted successfully!
              </span>
            </div>
          </div>
        </form>
      </div>

      <div class="tab-panel" id="myTab">
        <div class="complaints-list" id="myComplaintsList">
          <!-- cards added by JS -->
        </div>
      </div>
    </section>
  </div>

  <script>
    // ==== shared helpers, same as admin ====
    function getComplaints() {
      return JSON.parse(localStorage.getItem("complaints") || "[]");
    }
    function saveComplaints(list) {
      localStorage.setItem("complaints", JSON.stringify(list));
    }
    function getCurrentUser() {
      const s = localStorage.getItem("currentUser");
      return s ? JSON.parse(s) : null;
    }
    function clearCurrentUser() {
      localStorage.removeItem("currentUser");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const user = getCurrentUser();
      if (!user || user.role !== "user") {
        window.location.href = "index.html";
        return;
      }

      // show email in top bar
      document.getElementById("currentUserEmail").textContent = user.email;

      // logout
      document.getElementById("logoutBtnUser").addEventListener("click", () => {
        clearCurrentUser();
        window.location.href = "index.html";
      });

      // horizontal tabs
      const tabButtons = document.querySelectorAll(".tab-btn");
      const tabPanels = document.querySelectorAll(".tab-panel");

      tabButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          tabButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          const id = btn.dataset.tab;
          tabPanels.forEach((p) => p.classList.remove("active"));
          document.getElementById(id).classList.add("active");
        });
      });

      // submit complaint
      const form = document.getElementById("complaintForm");
      const successMsg = document.getElementById("complaintSuccess");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const transportType = document.getElementById("transportType").value;
        const title = document.getElementById("complaintTitle").value.trim();
        const route = document.getElementById("route").value.trim();
        const category = document.getElementById("category").value.trim();
        const description = document
          .getElementById("description")
          .value.trim();
        const dateInput = document.getElementById("incidentDate").value;

        const complaints = getComplaints();

        const complaint = {
          id: Date.now(),
          userEmail: user.email,
          transportType,
          title,
          route,
          category,
          description,
          date: dateInput || new Date().toLocaleDateString("en-GB"),
          status: "Open",
          feedback: "",
        };

        complaints.push(complaint);
        saveComplaints(complaints);

        form.reset();
        successMsg.hidden = false;
        setTimeout(() => (successMsg.hidden = true), 2000);

        renderMyComplaints();
      });

      // render my complaints
      function renderMyComplaints() {
        const listEl = document.getElementById("myComplaintsList");
        listEl.innerHTML = "";

        const all = getComplaints().filter((c) => c.userEmail === user.email);

        if (all.length === 0) {
          const p = document.createElement("p");
          p.className = "empty-text";
          p.textContent = "You have not submitted any complaints yet.";
          listEl.appendChild(p);
          return;
        }

        all.forEach((c) => {
          const card = document.createElement("article");
          card.className = "complaint-card";

          // left side
          const left = document.createElement("div");
          const title = document.createElement("div");
          title.className = "complaint-title";
          title.textContent = c.title;

          const desc = document.createElement("div");
          desc.className = "complaint-desc";
          desc.textContent = c.description || "";

          const metaRow = document.createElement("div");
          metaRow.className = "meta-row";

          const metaType = document.createElement("div");
          metaType.className = "meta-item";
          metaType.innerHTML =
            '<span class="meta-icon">🚍</span><span>' +
            (c.transportType || "—") +
            "</span>";

          const metaRoute = document.createElement("div");
          metaRoute.className = "meta-item";
          metaRoute.innerHTML =
            '<span class="meta-icon">📍</span><span>' +
            (c.route || "Route not specified") +
            "</span>";

          const metaDate = document.createElement("div");
          metaDate.className = "meta-item";
          metaDate.innerHTML =
            '<span class="meta-icon">📅</span><span>' +
            (c.date || "") +
            "</span>";

          metaRow.append(metaType, metaRoute, metaDate);

          const pill = document.createElement("div");
          pill.className = "status-pill";
          if (c.status === "Resolved") pill.classList.add("status-resolved");
          else if (c.status === "In Progress")
            pill.classList.add("status-in-progress");
          else pill.classList.add("status-open");
          pill.textContent = c.status || "Open";

          left.append(title, desc, metaRow, pill);

          // right: feedback
          const right = document.createElement("div");
          right.className = "complaint-actions";

          const fbText = document.createElement("div");
          fbText.className = "feedback-text";
          fbText.textContent = c.feedback
            ? "Your feedback: " + c.feedback
            : "No feedback added yet.";

          const fbBtn = document.createElement("button");
          fbBtn.className = "btn-secondary";
          fbBtn.textContent = c.feedback ? "Edit feedback" : "Give feedback";

          fbBtn.addEventListener("click", () => {
            const text = prompt(
              "Enter your feedback about how this complaint was handled:",
              c.feedback || ""
            );
            if (text === null) return;
            const list = getComplaints();
            const idx = list.findIndex((x) => x.id === c.id);
            if (idx !== -1) {
              list[idx].feedback = text.trim();
              saveComplaints(list);
              renderMyComplaints();
            }
          });

          right.append(fbText, fbBtn);

          card.append(left, right);
          listEl.appendChild(card);
        });
      }

      renderMyComplaints();
    });
  </script>
</body>
</html>
